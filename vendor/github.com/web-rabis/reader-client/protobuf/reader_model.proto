syntax = "proto3";
package reader;
option go_package = "./protobuf;protobuf";
import "google/protobuf/timestamp.proto";

message Reader {
  int64 global_ticket_number = 1;
  int64 ticket_number = 2;
  int64 library_id = 3;
  int64 branch_id = 4;
  string rfid_tag = 5;
  string barcode = 6;
  optional TypeCard type_card = 7;
  optional google.protobuf.Timestamp registration_date = 8;
  optional google.protobuf.Timestamp reregistration_date = 9;
  optional google.protobuf.Timestamp expiration_date = 10;
  optional google.protobuf.Timestamp last_visit_date = 11;
  optional google.protobuf.Timestamp correction_date = 12;
  string readers_hall =13;
  string iin = 14;
  string firstname = 15;
  string middlename = 16;
  string lastname = 17;
  optional int32 birth_date_year = 18;
  optional google.protobuf.Timestamp birth_date = 19;
  optional Dictionary sex = 20;
  optional SocialStatus social_status = 21;
  optional Dictionary nationality = 22;
  optional Dictionary speciality = 23;
  string address = 24;
  string email = 25;
  string phone = 26;
  string work_phone = 27;
  optional Dictionary education = 28;
  string place_employment = 29;
  string position = 30;
  optional Dictionary institution = 31;
  optional Dictionary academic_degree = 32;
  string course = 33;
  optional Dictionary faculty = 34;
  string note = 35;
  bool is_employee = 36;
  string photo_key = 37;
  // "pending" (ждёт решения библиотекаря) | "active" | "rejected" | "deleted"
  string status = 38;
}
message Dictionary {
  int64 id = 1;
  string name = 2;
}
message SocialStatus {
  int64 id = 1;
  string code = 2;
  string name = 3;
}
message TypeCard {
  int64 id = 1;
  int64 library_id = 2;
  optional int64 branch_id = 3;
  bool is_default = 4;
  string type = 5;
  string code = 6;
  string website = 7;
  string email = 8;
  string instagram_url = 9;
  optional int32 term_years = 10;
  string photo_key = 11;
  string title_photo_key = 12;
}
message Paging {
  int64   offset = 1;
  int64   limit = 2;
  string  sortKey = 3;
  int32   sortVal = 4;
}
message ReaderFilter {
  string status = 1;
  string query = 2;
  string iin = 3;
  optional google.protobuf.Timestamp expiration_date_low  = 4;
  optional google.protobuf.Timestamp expiration_date_high = 5;
  optional bool is_employee = 6;
}
message User {
  int64 id = 1;
  string name = 2;
  string username = 3;
  string email = 4;
  string state = 5;
}
message VisitFilter {
  optional google.protobuf.Timestamp checked_in_at_low = 1;
  optional google.protobuf.Timestamp checked_in_at_high = 2;
  optional google.protobuf.Timestamp checked_out_at_low = 3;
  optional google.protobuf.Timestamp checked_out_at_high = 4;
  optional bool open_only = 5;
  optional int64 ticket_number = 6;
}
// Поля совпадают с internal/model/visit.Visit в reader-сервисе - visit
// отдаётся клиентам как есть, без легаси-полей (zakazy/f51/count), см.
// mapper.VisitToProto в reader.
message Visit  {
  int64 id = 1;
  int64 reader_id = 2;
  int64 library_id = 3;
  int64 branch_id = 4;
  optional int64 department_id = 5;
  optional google.protobuf.Timestamp checked_in_at = 6;
  optional google.protobuf.Timestamp checked_out_at = 7;
  int64 checked_in_by = 8;
  int64 checked_out_by = 9;
}